<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ place.name }} — Улюблені локації Києва</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #e8e8f0;
    --rule:       rgba(90, 90, 130, 0.13);
    --ink:        #0d0d14;
    --muted:      #6d6d85;
    --card:       #ffffff;
    --chip:       #dedee8;
    --accent:     #a24e22;

    --grid:       44px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 0 96px;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--grid) - 1px),
      var(--rule) calc(var(--grid) - 1px),
      var(--rule) var(--grid)
    );
    color: var(--ink);
    font-family: "PT Serif", Georgia, serif;
    font-size: 17px;
    line-height: calc(var(--grid) / 2);
  }

  .sheet {
    max-width: 980px;
    margin: 0 auto;
    padding: calc(var(--grid) * 1.5) 24px 0;
  }

  .back {
    display: inline-block;
    margin-bottom: 20px;
    padding: 9px 16px;
    border: 1px solid rgba(13, 13, 20, 0.18);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--muted);
  }

  .back:hover { color: var(--ink); border-color: var(--ink); }

  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  h1 {
    margin: 0;
    font-family: "Rubik", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(34px, 6vw, 60px);
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  .keyline {
    height: 3px;
    margin: calc(var(--grid) * 0.5) 0;
    background: var(--ink);
  }

  .detail {
    padding: 30px 34px 34px;
    border: 1px dashed rgba(13, 13, 20, 0.35);
    background: var(--card);
  }

  .detail__top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .detail__meta {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .detail__rating {
    margin: 14px 0 0;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 3px;
  }

  .star { color: rgba(13, 13, 20, 0.18); }
  .star--on { color: var(--accent); }

  .detail__note {
    margin: 22px 0 0;
    max-width: 62ch;
    color: #2c2c3a;
    white-space: pre-line;
  }

  .detail__empty { margin: 22px 0 0; color: var(--muted); font-style: italic; }

  .tag {
    padding: 5px 10px;
    background: var(--chip);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tag--mine { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>

<main class="sheet">

  <a class="back" href="{% url 'places_list' %}">До списку</a>

  <h1>{{ place.name }}</h1>

  <div class="keyline"></div>

  <article class="detail">
    <div class="detail__top">
      <p class="detail__meta">{{ place.district|default:"район не вказано" }}</p>
      {% if place.is_custom %}
        <span class="tag tag--mine">моє</span>
      {% else %}
        <span class="tag">редакція</span>
      {% endif %}
    </div>

    {% if place.rating %}
      <p class="detail__rating" aria-label="Рейтинг {{ place.rating }} з 5">
        {% for i in "12345" %}<span class="star{% if forloop.counter <= place.rating %} star--on{% endif %}" aria-hidden="true">★</span>{% endfor %}
      </p>
    {% endif %}

    {% if place.note %}
      <p class="detail__note">{{ place.note }}</p>
    {% else %}
      <p class="detail__empty">Опису поки немає.</p>
    {% endif %}
  </article>

</main>
</body>
</html>
